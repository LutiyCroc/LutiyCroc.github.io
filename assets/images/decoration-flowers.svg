<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Стебель -->
  <path d="M50 150 Q50 100 50 60" stroke="#B8C8A9" stroke-width="3" fill="none"/>
  
  <!-- Листья -->
  <path d="M50 120 Q30 110 25 95 Q40 100 50 110" fill="#B8C8A9"/>
  <path d="M50 100 Q70 90 75 75 Q60 80 50 90" fill="#B8C8A9"/>
  
  <!-- Цветок -->
  <g id="flower">
    <!-- Лепестки -->
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(0 50 60)"/>
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(45 50 60)"/>
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(90 50 60)"/>
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(135 50 60)"/>
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(180 50 60)"/>
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(225 50 60)"/>
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(270 50 60)"/>
    <ellipse cx="50" cy="35" rx="15" ry="25" fill="#D990A6" transform="rotate(315 50 60)"/>
    
    <!-- Центр цветка -->
    <circle cx="50" cy="60" r="12" fill="#F8EAE4"/>
    <circle cx="50" cy="60" r="8" fill="#F5A8B0"/>
  </g>
</svg>
